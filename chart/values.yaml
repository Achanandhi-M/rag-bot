# Default values for api-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/keploy/rag-bot
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"


# command: ["/app/api"]
httpPort: 8000

imagePullSecrets: 
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

env:
  AZURE_OPENAI_ENDPOINT: ""
  OPENAI_API_VERSION: ""
  AZURE_OPENAI_API_KEY: ""
  MONGO_URI: ""

#  CLUSTER_TABLE: "hybridk8s-cluster-regression"


# secretRefs: is the list of secrets to be mounted as environment variables
#
# example of secret file:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: my-secret
# type: Opaque
# data:
#   DATABASE_URL: aHR0cDovL2V4YW1wbGUuY29t     # Base64-encoded value of "http://example.com"
#   API_KEY: dGVzdC1hcGkta2V5                 # Base64-encoded value of "test-api-key"
#   SECRET_KEY: c2VjcmV0X2tleV92YWx1ZQ==      # Base64-encoded value of "secret_key_value"
#   ANOTHER_VAR: YW5vdGhlcl92YXJfY29udGVudA== # Base64-encoded value of "another_var_content"
secretRefs:
  # - name: my-secret
  # - name: another-secret
  
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
# livenessProbe:
#   grpc:
#     port: 50051
# readinessProbe:
#   grpc:
#     port: 50051

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /chat
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources:
  requests:
    cpu: '250m'
    memory: '512Mi'
  limits:
    cpu: '2'
    memory: '3Gi'


# volumes:
#   - name: private-key-volume
#     secret:
#       secretName: private-key-secret
#       items:
#       - key: private-key
#         path: private-key

# volumeMounts:
#   - name: private-key-volume
#     mountPath: /etc/private-key
#     readOnly: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


# This section defines environment variables that will be set in the container.
# These variables can be used to configure the application running in the container.
# They can be set to specific values or can reference secrets for sensitive information.